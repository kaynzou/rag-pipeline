services:
  - type: web
    name: rag-pipeline-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: rag-index
      mountPath: /app/data/index
      sizeGB: 1
